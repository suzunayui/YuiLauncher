<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src ipc: http://ipc.localhost">
    <title>YuiLauncher</title>
    <link rel="icon" href="../assets/icon.ico">
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <header class="header">
      <div>
        <h1>YuiLauncher <small id="own-version" class="own-version"></small></h1>
        <p id="summary" class="summary" aria-live="polite"></p>
      </div>
      <button id="check" class="button">更新を確認</button>
    </header>

    <div id="self-update" class="self-update" hidden>
      <span id="self-update-text"></span>
      <button id="self-update-install" class="button primary">再起動して更新</button>
    </div>

    <main id="apps" class="apps"></main>
    <p id="all-hidden" class="all-hidden" hidden>すべてのアプリを非表示にしています。下の一覧から表示に戻せます。</p>

    <details id="hidden-apps" class="hidden-apps" hidden>
      <summary id="hidden-summary"></summary>
      <ul id="hidden-list" class="hidden-list"></ul>
    </details>

    <footer class="support">
      もし良かったら、開発の応援をお願いします！
      <button id="support" class="link">FANBOXで応援する</button>
    </footer>

    <dialog id="close-dialog" class="dialog">
      <h2 id="close-title"></h2>
      <p id="close-body"></p>
      <div class="dialog-actions">
        <button id="close-cancel" class="button">やめる</button>
        <button id="close-confirm" class="button primary">閉じて更新</button>
      </div>
    </dialog>

    <script src="bridge.js"></script>
    <script src="app.js"></script>
  </body>
</html>
